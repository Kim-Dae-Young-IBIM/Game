<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 확대 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd166" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>흔들흔들 펭귄 밴드</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 1) 접속: 방 코드(부모가 입력, QR로 들어오면 자동) + 큰 시작 버튼 -->
    <main id="join" class="screen">
      <div id="code-row">
        <svg class="tv-icon" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="10" width="56" height="38" rx="6" fill="#1b1035" />
          <rect x="10" y="16" width="44" height="26" rx="3" fill="#4cc9f0" />
          <rect x="22" y="52" width="20" height="5" rx="2" fill="#1b1035" />
        </svg>
        <input
          id="code"
          type="tel"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="4"
          autocomplete="off"
          placeholder="····"
          aria-label="방 코드"
        />
      </div>
      <button id="go" class="big-btn" aria-label="시작">
        <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="36,24 80,50 36,76" fill="#fff" /></svg>
      </button>
    </main>

    <!-- 2) 연주: 내 펭귄을 크게. 흔들면 TV에서 연주, 아래 버튼은 꽥·말하기 -->
    <main id="play" class="screen hidden">
      <img id="animal" src="/animals/penguin-1.svg" alt="" draggable="false" />
      <!-- ◀ ▶ 다른 동물로 바꾸기(다른 폰이 쓰는 동물은 건너뜀) -->
      <div id="chooser">
        <button id="prev" class="arrow" aria-label="이전 동물">
          <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M62 22 L34 50 L62 78" fill="none" stroke="#263347" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button id="next" class="arrow" aria-label="다음 동물">
          <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 22 L66 50 L38 78" fill="none" stroke="#263347" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </div>
      <div id="controls">
        <!-- 특별 버튼: 누르면 TV에서 내 캐릭터 소리(꽥·어흥·뿅·야옹) -->
        <button id="squawk" class="big-btn round" aria-label="특별 소리">
          <img id="effect-face" src="/animals/face-penguin-1.svg" alt="" draggable="false" />
        </button>
        <!-- 누르고 말하기: 누른 채 말하고 떼면 TV에서 펭귄 목소리로 -->
        <button id="mic" class="big-btn round" aria-label="말하기">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect x="38" y="16" width="24" height="44" rx="12" fill="#fff" />
            <path d="M28 46 Q28 70 50 70 Q72 70 72 46" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" />
            <rect x="46" y="70" width="8" height="14" fill="#fff" />
            <rect x="34" y="82" width="32" height="7" rx="3" fill="#fff" />
          </svg>
        </button>
      </div>
      <div id="offline" class="hidden" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#e63946" /><rect x="16" y="28" width="32" height="8" rx="4" fill="#fff" /></svg>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
